<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>000</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fff;
    color: #000;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    /* dynamic viewport height so iOS/Android browser chrome doesn't break the layout */
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  noscript {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    font: 48px/1 ui-monospace, Menlo, Consolas, monospace;
  }
</style>
</head>
<body>
<canvas id="void" aria-label="A void made of zeros" role="img"></canvas>
<noscript>000</noscript>
<script>
(() => {
  'use strict';

  const FONT = 'ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace';
  const INK = '#000';
  const PAPER = '#fff';

  // Timeline (seconds)
  const T_HOLD    = 0.7;   // show the full wall before the hole opens
  const T_OPEN    = 3.4;   // time for the hole to eat the whole wall
  const T_BLANK   = 0.8;   // empty page before 000 appears
  const T_BREATH  = 11.0;  // one full expand/collapse breath
  const T_LINGER  = 3.5;   // hold "000" in the center after each breath
  const RIM_BAND  = 3.0;   // width (in cells) of the blinking rim ahead of the hole
  const EDGE_BAND = 2.2;   // width (in cells) over which ring glyphs blink in / out
  const BLINK_HZ  = 15;    // how fast an edge cell can toggle

  const GLYPHS = ['.', 'o', '0', 'O'];

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.getElementById('void');
  const ctx = canvas.getContext('2d', { alpha: false });

  let W = 0, H = 0, DPR = 1;
  let fontSize = 16, cellW = 10, cellH = 16;
  let cols = 0, rows = 0, offX = 0, offY = 0;
  let cx = 0, cy = 0;          // pixel center (center of the center cell)
  let cells = [];              // { x, y, d, shed, dither, center }
  let center3 = [];            // the three cells that spell 000
  let maxD = 0;                // farthest cell distance from center (px)
  let sprites = {};            // glyph -> pre-rendered canvas (drawn at DPR resolution)
  let spriteW = 0, spriteH = 0;

  let last = performance.now();
  let elapsed = 0;             // seconds, pause-safe

  function hash(n) {
    n = (n ^ 61) ^ (n >>> 16);
    n = (n + (n << 3)) | 0;
    n = n ^ (n >>> 4);
    n = (n * 0x27d4eb2d) | 0;
    n = n ^ (n >>> 15);
    return ((n >>> 0) % 100000) / 100000;
  }

  const smooth = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  // Pre-render each glyph once. drawImage is far cheaper than fillText per cell,
  // and it lets glyphs scale continuously instead of popping.
  function buildSprites() {
    sprites = {};
    spriteW = Math.ceil(cellW * 1.4);
    spriteH = Math.ceil(cellH * 1.4);
    for (const g of GLYPHS) {
      const c = document.createElement('canvas');
      c.width = Math.ceil(spriteW * DPR);
      c.height = Math.ceil(spriteH * DPR);
      const sctx = c.getContext('2d');
      sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      sctx.fillStyle = INK;
      sctx.font = fontSize + 'px ' + FONT;
      sctx.textAlign = 'center';
      sctx.textBaseline = 'middle';
      sctx.fillText(g, spriteW / 2, spriteH / 2);
      sprites[g] = c;
    }
  }

  // Draw a glyph centered at (x, y) at native size. Glyphs are either on or off.
  function glyph(g, x, y) {
    ctx.drawImage(sprites[g], x - spriteW / 2, y - spriteH / 2, spriteW, spriteH);
  }

  // Binary blink: a cell with "on" probability pOn is drawn on this tick or not.
  // Each cell has its own phase so the whole edge never toggles in lockstep.
  function lit(k, t, pOn) {
    if (pOn >= 1) return true;
    if (pOn <= 0) return false;
    const tick = Math.floor(t * BLINK_HZ + k.phase * 7);
    return hash(k.seed + tick * 131) < pOn;
  }

  function layout() {
    const vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    H = Math.round(vv ? vv.height : window.innerHeight);
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // Glyph size scales with the short side so phones and desktops both read well.
    const minDim = Math.min(W, H);
    fontSize = Math.max(12, Math.min(22, Math.round(minDim / 26)));
    ctx.font = fontSize + 'px ' + FONT;
    cellW = ctx.measureText('0').width;
    cellH = fontSize * 1.05;
    buildSprites();

    // Odd counts so there is a true center cell. Overfill by a cell on each side.
    cols = Math.ceil(W / cellW) + 2; if (cols % 2 === 0) cols++;
    rows = Math.ceil(H / cellH) + 2; if (rows % 2 === 0) rows++;
    offX = (W - cols * cellW) / 2;
    offY = (H - rows * cellH) / 2;

    const ci = (cols - 1) / 2, ri = (rows - 1) / 2;
    cx = offX + (ci + 0.5) * cellW;
    cy = offY + (ri + 0.5) * cellH;

    cells = [];
    center3 = [];
    maxD = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = offX + (c + 0.5) * cellW;
        const y = offY + (r + 0.5) * cellH;
        const d = Math.hypot(x - cx, y - cy);
        const seed = r * 1031 + c * 7;
        const center = r === ri && Math.abs(c - ci) <= 1;
        const k = { x, y, d, seed, phase: hash(seed * 7 + 3), dither: hash(seed * 13 + 5) - 0.5, center };
        cells.push(k);
        if (center) center3.push(k);
        if (d > maxD) maxD = d;
      }
    }
  }

  function clear() {
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
  }

  // "000" in the center: full black, no fade.
  function draw000() {
    for (let i = 0; i < center3.length; i++) glyph('0', center3[i].x, center3[i].y);
  }

  // Phase 1: a wall of zeros with a hole opening from the center outward.
  // Cells ahead of the edge blink out with rising probability until they're gone.
  function drawWall(holeR, t) {
    clear();
    const band = RIM_BAND * cellH;
    for (let i = 0; i < cells.length; i++) {
      const k = cells[i];
      const gap = k.d - holeR;             // distance ahead of the hole edge
      if (gap <= 0) continue;              // eaten
      if (gap < band) {
        const u = gap / band;              // 1 = untouched, 0 = at the edge
        if (!lit(k, t, smooth(u * 1.15))) continue;
        const n = hash(k.seed + Math.floor(t * 8) * 97);
        const g = u < 0.3 ? (n < 0.5 ? '.' : 'o') : u < 0.6 ? (n < 0.35 ? 'o' : '0') : '0';
        glyph(g, k.x, k.y);
      } else {
        glyph('0', k.x, k.y);
      }
    }
  }

  // Phase 2: 000 breathing into concentric rings and back.
  function drawBreath(t) {
    clear();
    const minDim = Math.min(W, H);
    const rMin = cellH * 0.5;
    const rMax = minDim * 0.44;
    // Even cadence: mostly linear in radius so cells appear at a steady rate,
    // with a little rounding at the turnarounds so it doesn't bounce.
    const f = t / T_BREATH;
    const tri = 1 - Math.abs(2 * f - 1);
    const cos = (1 - Math.cos(2 * Math.PI * f)) / 2;
    const p = 0.6 * tri + 0.4 * cos;
    const r = rMin + (rMax - rMin) * p;
    const ripple = t * 0.8;                           // slow outward ripple of ring weights
    const edgeBand = EDGE_BAND * cellH;

    for (let i = 0; i < cells.length; i++) {
      const k = cells[i];
      if (k.center) continue;                         // drawn solid below
      const m = (r - k.d) / edgeBand;                 // >1 solid, <0 off, between: blinking
      if (m <= -0.15) continue;
      if (!lit(k, t, smooth(m + 0.15))) continue;
      const u = k.d / Math.max(r, 1);                 // 0 at center, 1 at the edge
      const ring = k.d / cellH;
      const w = u + 0.17 * Math.sin(ring * 1.25 - ripple) + k.dither * 0.07;
      const g = w > 0.86 ? '.' : w > 0.62 ? 'o' : w > 0.30 ? '0' : 'O';
      glyph(g, k.x, k.y);
    }
    draw000();
  }

  function render(now) {
    const dt = Math.min(0.1, (now - last) / 1000);    // clamp so a backgrounded tab doesn't jump
    last = now;
    elapsed += dt;

    const tIntro = T_HOLD + T_OPEN + T_BLANK;
    if (elapsed < T_HOLD) {
      drawWall(0, elapsed);
    } else if (elapsed < T_HOLD + T_OPEN) {
      const t = easeInOut((elapsed - T_HOLD) / T_OPEN);
      drawWall(t * (maxD + RIM_BAND * cellH), elapsed);
    } else if (elapsed < tIntro) {
      clear();
    } else {
      const since = elapsed - tIntro;
      const t = since % (T_BREATH + T_LINGER);
      if (since < 0.6) {
        // first appearance: 000 blinks in, then holds
        clear();
        if (hash(Math.floor(since * 16) * 977) < smooth(since / 0.6)) draw000();
      } else if (t < T_BREATH) {
        drawBreath(t);
      } else {
        clear();
        draw000();
      }
    }
    requestAnimationFrame(render);
  }

  function restart() {
    elapsed = 0;
    last = performance.now();
  }

  function drawStatic() {
    // Reduced motion: just the solid 000.
    clear();
    draw000();
  }

  let resizeTimer = 0;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      layout();
      if (reduceMotion) drawStatic();
    }, 60);
  }

  layout();
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

  if (reduceMotion) {
    drawStatic();
  } else {
    canvas.addEventListener('pointerdown', restart);
    requestAnimationFrame((now) => { last = now; render(now); });
  }
})();
</script>
</body>
</html>
